name: graph-check

on:
  push:
  # editedを足すのは、PRの説明を直したときにrefsを回し直すためである。既定の3つだけだと、
  # 説明を直しても走らず、失敗したジョブを再実行しても直す前の説明を読む（#82）
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # PRの本文が、実在するノードのidを指しているかを確かめる（META-07の「PRにはノードのidを書く」）。
  # PRのときだけ走る。
  refs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PRが指すノードが実在するか
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/check_refs.py

  # PRのブランチ名・題・コミットの1行目が、決まりに合うかを確かめる
  # （META-07の「ブランチ名とコミットの1行目」）。PRのときだけ走る。
  names:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # PRに含まれるコミットを、baseとheadの間で数えるため
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ブランチ名とコミットの1行目が決まりに合うか
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/check_names.py

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # G011（放置された未確定ノードの検出）はgit履歴の日付を使う。
          # 既定の浅いクローンだと全ファイルが同じ日付になり、検査が飛ばされる。
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 外部依存はないのでinstallなし
      - name: テストを走らせる
        run: python -m unittest discover -s tests -t .

      # mainへのpushとPRでは警告も失敗にする（--strict）。
      # それ以外のブランチへのpushでは警告を出すだけにして、作業の途中で止めない。
      #
      # PRでも--strictを走らせるのは、PRが緑のままmainが落ちたため
      # （graph-doc-template#6。tournament-botで3回続けてマージし、約10時間気づかなかった）。
      # --sinceを付けない--strictではG015 / G017は出ない（変更の窓が空になる）。
      # 落ちるのはグラフそのものの警告とエラーだけで、マージした後のmainと同じ判定になる。
      #
      # PRでは別に、G015（追従漏れ）とG017の窓をbaseブランチまで広げて一覧を出す。
      # こちらは失敗にしない。「見たか」を聞く警告で、追従が要るかどうかは人が決める。
      - name: グラフを検証する（mainとPRはstrict / PRは追従漏れも見る）
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "mainへのpushなので--strictで検証します"
            python -m tools.graph check --strict
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PRなのでorigin/${{ github.base_ref }}との差分でG015 / G017も見ます（失敗にはしません）"
            python -m tools.graph check --since "origin/${{ github.base_ref }}"
            echo "マージした後のmainと同じ判定を--strictで走らせます"
            python -m tools.graph check --strict
          else
            echo "警告は失敗にしません（mainへのpushとPRだけ--strict）"
            python -m tools.graph check
          fi

      - name: 関連ドキュメントが最新か確かめる
        run: python -m tools.graph sync --check

      # [[ID]]のままだとGitHub上でただの文字として出る（クリックできない）。
      # 相対リンクに直っているかを見る。グラフは両方を同じmentionsとして
      # 扱うので、直しても検証結果は変わらない。
      - name: 本文の参照がリンクになっているか確かめる
        run: python -m tools.graph linkify --check

      # make経由で呼ぶ。graph.mkのREADME_GRAPH_ARGS（--aggregateなど）を
      # 効かせるため。直接pythonを叩くと、間引いているリポジトリで
      # 「図が古い」と誤判定して落ちる。
      - name: READMEの図が最新か確かめる
        run: make readme-check

      - name: 集計を出す
        if: always()
        run: python -m tools.graph stats

      # AI lint（graph review）はここで回さない。
      # 指摘が再現せず、APIキーと費用と通信が要るため。人が手で回す。
