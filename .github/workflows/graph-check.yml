name: graph-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 外部依存はないので install なし
      - name: グラフを検証する
        run: python -m tools.graph check

      - name: 関連ドキュメントが最新か確かめる
        run: python -m tools.graph sync --dry-run --check

      - name: 集計を出す
        if: always()
        run: python -m tools.graph stats
