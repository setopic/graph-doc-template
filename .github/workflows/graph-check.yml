name: graph-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # G011（放置された未確定ノードの検出）は git 履歴の日付を使う。
          # 既定の浅いクローンだと全ファイルが同じ日付になり、検査が飛ばされる。
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 外部依存はないので install なし
      - name: グラフを検証する
        run: python -m tools.graph check

      - name: 関連ドキュメントが最新か確かめる
        run: python -m tools.graph sync --check

      - name: README の図が最新か確かめる
        run: python -m tools.graph render --format mermaid --into README.md --check

      - name: 集計を出す
        if: always()
        run: python -m tools.graph stats
