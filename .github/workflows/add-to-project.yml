# issueとPRをGitHub Projectに載せる。**載せるだけ**で、列（Status）の移動は
# Projectの組み込みのワークフロー（閉じたらDoneなど）に任せる。
#
# **先にProjectの組み込みのAuto-addを使う。** トークンが要らず、このファイルも要らない。
#
#   Projectの右上のメニュー → Workflows → Auto-add to project → Edit
#     Filtersでリポジトリを選び、絞り込みをis:issue,prにしてSave and turn on workflow
#     2つ目のリポジトリは、Auto-add to projectの「…」→ Duplicate workflowで足す
#
# **このファイルは、Auto-addの数が足りないときに使う。** Auto-addは1つで
# 1リポジトリしか覆えず、作れる数にプランの上限がある（Freeは1、ProとTeamは5）。
# こちらは数の上限が無い代わりに、PATを秘密に置くことになる。
#
# **設定が無ければ何もしない。** 次の2つが揃ったリポジトリでだけ動く。
# テンプレートはProjectを持たないので、取り込んだだけの派生ではCIも落ちない。
#
#   Settings → Secrets and variables → Actions
#     Variables: PROJECT_URL         https://github.com/users/<持ち主>/projects/<番号>
#     Secrets:   ADD_TO_PROJECT_PAT  classicのPAT。projectスコープ（非公開ならrepoも）
#
# **秘密を先に置く。** URLだけ先に置くと、issueとPRのたびに警告が出る。
#
# **GITHUB_TOKENではProjects v2に書けない。** だからPATが要る。
# Projectはリポジトリと同じ持ち主の下に作る。持ち主が違うと、issueではなく
# 下書きとして載る（actions/add-to-projectの仕様）。
#
# **ボードの「済」は2つの意味を持つ。** issueを閉じるのは答えが出て文書へ移したとき
# （META-07）で、PRを閉じるのは入ったとき。ビューをis:issueとis:prで分けて見る。
#
# 限界: フォークからのPRは載らない（pull_requestには秘密が渡らない）。
# 外からPRを受けるようになったらpull_request_targetに変える。
# このワークフローはコードをcheckoutしないので、変えても安全に保てる。
name: add-to-project

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request:
    types: [opened, reopened]

# PATだけで動く。GITHUB_TOKENには何も与えない。
permissions: {}

jobs:
  add:
    if: vars.PROJECT_URL != ''
    runs-on: ubuntu-latest
    # 秘密はifで直接見られないので、ジョブの環境変数を経由する。
    env:
      HAS_PAT: ${{ secrets.ADD_TO_PROJECT_PAT != '' }}
    steps:
      - uses: actions/add-to-project@v2
        if: env.HAS_PAT == 'true'
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

      # URLだけ設定してPATを忘れると、緑のまま何も載らない。落とさずに知らせる。
      - name: PATが無い
        if: env.HAS_PAT != 'true'
        run: echo "::warning::PROJECT_URLはあるがADD_TO_PROJECT_PATが無いため、Projectに載せません"
